@for (item of cardDataList; track $index) {
<div class="flex">
  <div class="flex-col full-width">
    @if (cardActions?.length) {
    <!-- [cardActions]: the card gets the hover buttons -->
    <verben-card-hover-actions
      [item]="item"
      [actions]="cardActions!"
      [position]="cardActionsPosition"
    >
      <ng-container
        *ngTemplateOutlet="card; context: { $implicit: item }"
      ></ng-container>
    </verben-card-hover-actions>
    } @else {
    <ng-content
      *ngTemplateOutlet="card; context: { $implicit: item }"
    ></ng-content>
    }
    <!-- children -->
    <ng-template #childrenList>
      @for (child of item.children; track $index) {
      @if (childActions?.length) {
      <!-- child cards get the hover buttons too (cardChildActions, else cardActions) -->
      <verben-card-hover-actions
        [item]="child"
        [actions]="childActions!"
        [position]="cardActionsPosition"
      >
        <ng-container
          *ngTemplateOutlet="
            cardChild;
            context: { index: $index, $implicit: child }
          "
        ></ng-container>
      </verben-card-hover-actions>
      } @else {
      <ng-container
        *ngTemplateOutlet="
          cardChild;
          context: { index: $index, $implicit: child }
        "
      ></ng-container>
      }
      }
    </ng-template>
    <div
      class="childrenPadding flex-col flex"
      *ngIf="item.children.length > 0 && item.isChildrenExpanded"
    >
      @if (useVirtualScroll) {
      <cdk-virtual-scroll-viewport
        [itemSize]="virtualScrollItemSize"
        class="virtual-scroll-viewport"
        [style.height.px]="virtualScrollItemSize * 50"
      >
        <ng-container *ngTemplateOutlet="childrenList"></ng-container>
      </cdk-virtual-scroll-viewport>
      } @else {
      <ng-container *ngTemplateOutlet="childrenList"></ng-container>
      }
    </div>
    <div *ngIf="item.isChildrenExpanded" class="false-padding">
      <ng-content
        *ngTemplateOutlet="
          cardFooter;
          context: { index: $index, $implicit: item }
        "
      ></ng-content>
    </div>
  </div>
</div>

}
