<verben-card
  width="24rem"
  borderRadius="1rem"
  [border]="'1px solid #D4A007'"
  bgColor="#FFFFFF"
  class="export-card"
>
  <div card-header class="card-header">
    <h4 class="header-title">Expand</h4>
    <button
      class="reset-button"
      [style.color]="'#3479E9'"
      [style.background-color]="'transparent'"
      [style.border]="'none'"
      [style.cursor]="'pointer'"
      [style.font-size]="'12px'"
      (click)="reset()"
    >
      Reset
    </button>
  </div>
  <div card-body class="card-body">
    <section class="section">
      <div class="section-header">
        <h3 class="section-title">Entity</h3>
        <verben-svg
          icon="info"
          [width]="15"
          [height]="15"
          fill="grey"
        ></verben-svg>
      </div>
      <div *ngFor="let item of visibleItems(); let i = index" class="item">
        <div class="item-label">
          <!-- <input
            type="checkbox"
            [id]="'item-' + i"
            [(ngModel)]="item.selected"
          /> -->
          <label [for]="'item-' + i" class="checkbox-label">
            {{ item.Name }}
          </label>
        </div>
        <div class="item-actions">
          <verben-svg
            icon="edit"
            [width]="15"
            [height]="15"
            stroke="#3479E9"
            fill="white"
            (click)="editItem(i)"
          ></verben-svg>
          <verben-svg
            icon="delete"
            [width]="15"
            [height]="15"
            stroke="#E20000"
            (click)="removeItem(i)"
          ></verben-svg>
        </div>
      </div>
      <div
        *ngIf="items().length > 3"
        (click)="toggleShowAll()"
        class="show-more"
      >
        <span>{{ showAll() ? "Show less" : "Show more" }}</span>
        <verben-svg
          icon="chevron"
          [width]="8"
          [height]="6"
          fill="black"
          stroke="black"
        ></verben-svg>
      </div>
    </section>
    <hr class="divider" />
    <section class="section">
      <div class="section-header">
        <h3 class="section-title">Properties</h3>
        <verben-svg
          icon="info"
          [width]="15"
          [height]="15"
          fill="grey"
        ></verben-svg>
      </div>
      <form [formGroup]="form" (ngSubmit)="addItem()">
        <div class="">
          <p class="">Name</p>
          <verbena-input
            placeholder="Enter property name"
            border="1px solid #ccc"
            borderRadius="5px"
            textColor="black"
            width="100%"
            fontSize="11px"
            height="20px"
            pd="2px 4px !important"
            bgColor="transparent"
            [showBorder]="true"
            [showErrorMessage]="true"
            [errorPosition]="'bottom'"
            formControlName="Name"
          ></verbena-input>
        </div>

        <div>
          <label for="DataType">Data Type</label>
          <verben-drop-down
            id="DataType"
            width="'100%'"
            height="'1.25rem'"
            placeholder="Select type"
            [options]="dataTypes"
            formControlName="DataType"
          >
          </verben-drop-down>
        </div>

        <div>
          <label htmlFor="Options" class="mb-2">Enter Options</label>
          <verben-chip
            label="Options"
            id="Options"
            [placeholder]="'Enter Options'"
            formControlName="Options"
          ></verben-chip>
        </div>

        <div>
          <label for="DefaultValue">Default Value</label>

          <verbena-input
            [placeHolder]="'Enter default text'"
            formControlName="DefaultValue"
            id="DefaultValue"
            label="Default Value (optional)"
          />
        </div>

        <div>
          <p class="mb-2">Required</p>

          <verbena-switch
            label="Required"
            [onColor]="'#1A237E'"
            formControlName="IsRequired"
          ></verbena-switch>
        </div>

        <div class="value-range">
          <verbena-input
            [type]="'number'"
            name="minValue"
            label="Min Value"
            formControlName="MinValue"
          />
          <verbena-input
            [type]="'number'"
            name="maxValue"
            label="Max Value"
            formControlName="MinValue"
          />
        </div>

        <button
          [disabled]="!form.valid"
          class="add-button ml-auto"
          type="submit"
        >
          + Add
        </button>
      </form>
    </section>
  </div>
  <div card-footer class="card-footer">
    <button class="export-button" (click)="save()">Extend</button>
  </div>
</verben-card>
