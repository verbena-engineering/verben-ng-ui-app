<verben-card
  width="24rem"
  borderRadius="1rem"
  [border]="'1px solid var(--vbn-color-primary)'"
  bgColor="var(--vbn-color-surface)"
>
  <div card-header class="card-header">
    <h4 class="header-title">
      Filter <sup>({{ activeFilterCount }})</sup>
    </h4>
    <button
      class="reset-button"
      [style.color]="'var(--vbn-color-border-focus)'"
      [style.background-color]="'transparent'"
      [style.border]="'none'"
      [style.cursor]="'pointer'"
      [style.font-size]="'12px'"
      (click)="resetAll()"
    >
      Reset
    </button>
  </div>

  <div card-body class="card-body">
    <!-- Saved Filters Section -->
    <section class="section">
      <div class="section-header">
        <h3 class="section-title">Filters</h3>
        <verben-svg
          icon="info"
          [width]="15"
          [height]="15"
          fill="var(--vbn-color-text-muted)"
        ></verben-svg>
      </div>

      <div
        *ngFor="let filter of visibleFilters"
        class="item"
        [class.item-editing]="isEditing(filter)"
      >
        <div class="item-label">
          <!-- A required filter is always active, so its checkbox is ticked and
               locked rather than hidden — the state stays readable. -->
          <input
            type="checkbox"
            [(ngModel)]="filter.selected"
            [disabled]="isRequired(filter)"
            (ngModelChange)="markTouched()"
          />
          <label>{{ getFilterDescription(filter) }}</label>
        </div>

        <div class="item-actions">
          <button
            type="button"
            class="icon-button"
            aria-label="Edit filter"
            (click)="editFilter(filter)"
          >
            <!-- Only `stroke` is passed: `verben-svg` resolves a single colour as
                 `fill || stroke` and applies it to both, so also passing `fill`
                 would paint the icon in whatever `fill` holds. -->
            <verben-svg
              icon="edit"
              [width]="15"
              [height]="15"
              stroke="var(--vbn-color-border-focus)"
            ></verben-svg>
          </button>
          <button
            type="button"
            class="icon-button"
            aria-label="Delete filter"
            [disabled]="isRequired(filter)"
            (click)="deleteFilter(filter)"
          >
            <verben-svg
              icon="delete"
              [width]="15"
              [height]="15"
              stroke="var(--vbn-color-error)"
            ></verben-svg>
          </button>
        </div>
      </div>

      <div
        *ngIf="savedFilters.length > maxVisibleItems"
        class="show-more"
        (click)="showAllFilters = !showAllFilters"
      >
        {{ showAllFilters ? "Show Less" : "Show More" }}
      </div>
    </section>

    <hr class="divider" />

    <!-- New Filter Operation -->
    <section class="section">
      <div class="section-header">
        <h3 class="section-title">Operation</h3>
        <verben-svg
          icon="info"
          [width]="15"
          [height]="15"
          fill="var(--vbn-color-text-muted)"
        ></verben-svg>
      </div>

      <div class="operation-grid">
        <!-- Column Selection -->
        <verben-drop-down
          width="100%"
          height="1.025rem"
          placeholder="Select column"
          [options]="filterableColumns"
          optionLabel="header"
          optionValue="id"
          [disabled]="isEditingRequired"
          [(ngModel)]="currentFilter.columnId"
          (ngModelChange)="onColumnSelect($event)"
        ></verben-drop-down>

        <!-- Operator Selection -->
        <verben-drop-down
          width="100%"
          height="1.025rem"
          placeholder="Select operator"
          [options]="availableOperators"
          optionLabel="label"
          optionValue="value"
          [(ngModel)]="currentFilter.operator"
        ></verben-drop-down>

        <!-- Value Input based on type -->
        <ng-container [ngSwitch]="currentColumnType">
          <!-- Date Input — native rather than the library date picker, whose
               overlay renders off screen from this narrow panel. -->
          <verbena-input
            *ngSwitchCase="'date'"
            type="date"
            placeHolder="Select date"
            border="1px solid var(--vbn-color-border)"
            borderRadius="5px"
            textColor="var(--vbn-color-text)"
            width="100%"
            height="1.025rem"
            pd="2px 6px"
            [(ngModel)]="currentFilter.value"
          ></verbena-input>

          <!-- Number Input -->
          <verbena-input
            *ngSwitchCase="'number'"
            type="number"
            placeHolder="Enter number"
            border="1px solid var(--vbn-color-border)"
            borderRadius="5px"
            textColor="var(--vbn-color-text)"
            width="100%"
            height="1.025rem"
            pd="2px 6px"
            [(ngModel)]="currentFilter.value"
          ></verbena-input>

          <!-- Yes / No Selection -->
          <verben-drop-down
            *ngSwitchCase="'bool'"
            width="100%"
            height="1.025rem"
            placeholder="Select value"
            [options]="valueOptions"
            optionLabel="label"
            optionValue="value"
            [(ngModel)]="currentFilter.value"
          ></verben-drop-down>

          <!-- Enum Member Selection -->
          <verben-drop-down
            *ngSwitchCase="'enum'"
            width="100%"
            height="1.025rem"
            placeholder="Select value"
            [options]="valueOptions"
            optionLabel="label"
            optionValue="value"
            [(ngModel)]="currentFilter.value"
          ></verben-drop-down>

          <!-- Text Input (default) -->
          <verbena-input
            *ngSwitchDefault
            type="text"
            placeHolder="Enter text"
            border="1px solid var(--vbn-color-border)"
            borderRadius="5px"
            textColor="var(--vbn-color-text)"
            width="100%"
            height="1.025rem"
            pd="2px 6px"
            [(ngModel)]="currentFilter.value"
          ></verbena-input>
        </ng-container>
      </div>

      <div class="operation-actions">
        <button class="clear-button" (click)="clearCurrentFilter()">
          Clear
        </button>
        <button class="add-button" (click)="addFilter()">+ Add</button>
      </div>
    </section>
  </div>

  <div card-footer class="card-footer">
    <button class="export-button" (click)="applyFilters()">Filter</button>
  </div>
</verben-card>
