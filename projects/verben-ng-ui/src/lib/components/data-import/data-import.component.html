<verben-card
  width="24rem"
  borderRadius="1rem"
  [border]="'1px solid var(--vbn-color-primary)'"
  bgColor="var(--vbn-color-surface)"
  class="export-card"
>
  <div card-header class="card-header">
    <h4 class="header-title">Import</h4>
    <button
      class="reset-button"
      [style.color]="'var(--vbn-color-border-focus)'"
      [style.background-color]="'transparent'"
      [style.border]="'none'"
      [style.cursor]="'pointer'"
      [style.font-size]="'12px'"
      (click)="reset()"
    >
      Reset
    </button>
  </div>
  <div card-body class="card-body">
    <div class="flex gap-4 justify-between">
      <button class="export-button" (click)="handleTemplateExport()">
        Download Template
      </button>
      <label [attr.for]="fileInputId" class="export-button">Upload File</label>
    </div>
    <hr class="divider" />
    <section class="section">
      <div
        class="drop-area"
        (dragover)="onDragOver($event)"
        (dragleave)="onDragLeave($event)"
        (drop)="onDrop($event)"
      >
        <p>
          Drag and drop files here or
          <label
            [attr.for]="fileInputId"
            [style.color]="'var(--vbn-color-border-focus)'"
            >click to browse</label
          >
        </p>
        <input
          type="file"
          [attr.id]="fileInputId"
          (change)="onFileSelected($event)"
          style="display: none"
          accept=".csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel"
          multiple
        />
      </div>
      <div *ngIf="files.length > 0">
        <h3>Uploaded Files:</h3>
        <ul>
          <li *ngFor="let file of files">{{ file.name }}</li>
        </ul>
      </div>
    </section>
  </div>
  <div card-footer class="card-footer">
    <button
      [disabled]="service.importedData().length < 1"
      class="export-button"
      (click)="save()"
    >
      Import
    </button>
  </div>
</verben-card>

<!-- Modal Component -->
<verben-dialogue
  [showCloseIcon]="true"
  [dismissOutsideClick]="true"
  [closeOnEscape]="true"
  [size]="'large'"
  [mode]="'dialogue'"
  [customClass]="'my-modal-custom-class'"
  [disableFooter]="false"
  [modalData]="[{ data: {} }]"
  [isVisible]="showPreview"
  [headerTemplate]="headerTemplate"
  [bodyTemplate]="bodyTemplate"
  [footerTemplate]="footerTemplate"
  dialogueWidth="85%"
>
  <a download=""></a>
</verben-dialogue>

<!-- Define templates -->
<ng-template #headerTemplate>
  <h2>Upload Preview</h2>
</ng-template>

<ng-template #bodyTemplate>
  <div class="flex gap-4 items-center justify-between my-4">
    <p class="">Total Items: {{ service.importedData().length }}</p>

    <p class="">Duplicates: {{ duplicateIndexSet.size }}</p>

    <p class="">Invalid Items: {{ invalidIndexSet.size }}</p>

    <verben-drop-down
      [multiselect]="true"
      placeholder="Find duplicates by"
      [options]="headers()"
      [ngModel]="uniqueIdentifiers()"
      (ngModelChange)="uniqueIdentifiers.set($event)"
    ></verben-drop-down>
  </div>
  <div style="max-height: min(75vh, 780px); overflow: auto">
    <lib-data-table
      [data]="service.importedData()"
      [columns]="previewColumnsList()"
      [formGroupConfig]="formGroupConfig()"
      [useVirtualScroll]="true"
      (rowSave)="service.addRow($event)"
    >
      <ng-container libColumn="actions">
        <ng-template
          #cell
          let-value
          let-deleteRow="deleteRow"
          let-isEditing="isEditing"
          let-toggleRowEdit="toggleRowEdit"
          let-row="row"
          let-rowIndex="rowIndex"
        >
          <div class="flex action-buttons">
            <verben-svg
              (click)="toggleRowEdit()"
              icon="edit"
              [width]="15"
              [height]="15"
              class="cursor-pointer"
            ></verben-svg>

            <verben-svg
              icon="delete"
              [width]="15"
              [height]="15"
              (click)="deleteRow()"
              class="cursor-pointer"
            ></verben-svg>
          </div>
        </ng-template>

        <ng-template
          #cellEdit
          let-value
          let-deleteRow="deleteRow"
          let-isEditing="isEditing"
          let-toggleRowEdit="toggleRowEdit"
          let-row="row"
          let-rowIndex="rowIndex"
        >
          <div class="flex action-buttons">
            <verben-svg
              (click)="toggleRowEdit()"
              icon="tick"
              [width]="15"
              [height]="15"
              class="cursor-pointer"
            ></verben-svg>

            <verben-svg
              icon="delete"
              [width]="15"
              [height]="15"
              (click)="deleteRow()"
              class="cursor-pointer"
            ></verben-svg>
          </div>
        </ng-template>
      </ng-container>
    </lib-data-table>
  </div>
</ng-template>

<ng-template #footerTemplate>
  <div class="footer-buttons flex gap-4 items-center justify-between my-4">
    <button
      class="btn btn-secondary cancel-button"
      (click)="showPreview = false"
    >
      Cancel
    </button>
    <button class="btn btn-primary export-button" (click)="save()">
      Complete
    </button>
  </div>
</ng-template>
