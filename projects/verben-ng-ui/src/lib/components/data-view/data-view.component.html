<div class="toolbar">
  <div class="dv-search-group">
    <div *ngIf="viewState.isToggle" class="toggle-button-container">
      <button type="button" (click)="toggleView()" [ngClass]="buttonClass">
        <verben-svg
          [icon]="tableIcon"
          [class.active]="!isTableView"
          [ngClass]="!isTableView ? activeIconClass : iconClass"
        ></verben-svg>
        <verben-svg
          [icon]="cardIcon"
          [class.active]="isTableView"
          [ngClass]="isTableView ? activeIconClass : iconClass"
          [width]="25"
          [height]="25"
        ></verben-svg>
      </button>
    </div>
    <!-- Search Input -->
    <div
      [style.width]="inputWidth"
      class="search-input"
      *ngIf="viewState.isSearch"
    >
      <verben-svg [icon]="'search2'" [width]="20" [height]="20"></verben-svg>
      <input
        *ngIf="!useTwoWayBinding"
        [type]="'text'"
        [placeholder]="'Search'"
        (input)="onSearch($event)"
        [style.border]="'0'"
        [value]="searchValue"
      />
      <input
        *ngIf="useTwoWayBinding"
        [type]="'text'"
        [placeholder]="'Search'"
        (input)="onSearch($event)"
        [style.border]="'0'"
        [(ngModel)]="searchValue"
      />
      <verben-svg
        *ngIf="searchValue.length > 0"
        [icon]="'close'"
        [width]="15"
        (click)="onClearSearch()"
        class="close-icon-class"
        [height]="15"
      ></verben-svg>
    </div>
  </div>
  <div class="relative dv-actions">
    <!-- Column Section -->
    <ng-container
      [appOutSideClick]="showColumnChild"
      (outSideClick)="resetChildViewsExcept('column')"
      *ngIf="viewState.isColumn && isTableView"
    >
      <ng-container *ngIf="columnTemplate; else defaultColumn"></ng-container>
      <ng-template #defaultColumn>
        <span
          [ngClass]="[
            'dv-action',
            columnCustomClass ? columnCustomClass : '',
          ]"
          [class.is-open]="showColumnChild"
          (click)="toggleChildView('column')"
        >
          <verben-svg [width]="15" [icon]="'column'"></verben-svg>
          <span>Columns</span><span class="dv-count">{{ selectedColumnCount }}</span>
        </span>
        <div
          [style.z-index]="zIndex"
          class="data-view-element"
          [style.display]="showColumnChild ? 'block' : 'none'"
        >
          <!-- Kept in the DOM (hidden via display) rather than *ngIf so the
              projected panel stays change-detected and reflects host state
              updates (e.g. restored column arrangement) even while collapsed. -->
          <ng-content select="[column-content]"></ng-content>
        </div>
      </ng-template>
    </ng-container>

    <!-- Filter Section -->
    <ng-container
      [appOutSideClick]="showFilterChild"
      (outSideClick)="resetChildViewsExcept('filter')"
      *ngIf="viewState.isFilter"
      (click)="stopPropagation($event)"
    >
      <ng-container *ngIf="filterTemplate; else defaultFilter"></ng-container>
      <ng-template #defaultFilter>
        <span
          [ngClass]="[
            'dv-action',
            filterCustomClass ? filterCustomClass : '',
          ]"
          [class.is-open]="showFilterChild"
          (click)="toggleChildView('filter')"
        >
          <verben-svg [width]="15" [icon]="'filter'"></verben-svg>
          <span>Filter</span><span class="dv-count">{{ selectedFilterTableCount }}</span>
        </span>
        <div
          (click)="stopPropagation($event)"
          [style.z-index]="zIndex"
          class="data-view-element"
          [style.display]="showFilterChild ? 'block' : 'none'"
        >
          <!-- Kept in the DOM (hidden via display) rather than *ngIf so the
               projected panel stays change-detected and reflects host state
               updates (e.g. restored filters) even while collapsed. -->
          <ng-content select="[filter-content]"></ng-content>
        </div>
      </ng-template>
    </ng-container>
    <!--import Section-->
    <ng-container
      [appOutSideClick]="showImportChild"
      (outSideClick)="resetChildViewsExcept('import')"
      *ngIf="viewState.isImport"
      (click)="stopPropagation($event)"
    >
      <ng-container *ngIf="importTemplate; else defaultImport"></ng-container>
      <ng-template #defaultImport>
        <span
          [ngClass]="[
            'dv-action',
            importCustomClass ? importCustomClass : '',
          ]"
          [class.is-open]="showImportChild"
          (click)="toggleChildView('import')"
        >
          <verben-svg [width]="15" [icon]="'file'"></verben-svg>
          <span>Import</span>
        </span>
        <div
          (click)="stopPropagation($event)"
          [style.z-index]="zIndex"
          class="data-view-element"
        >
          <ng-content
            *ngIf="showImportChild"
            select="[import-content]"
          ></ng-content>
        </div>
      </ng-template>
    </ng-container>
    <!-- Sort Section -->
    <ng-container
      [appOutSideClick]="showSortChild"
      (outSideClick)="resetChildViewsExcept('sort')"
      *ngIf="viewState.isSort"
    >
      <ng-container *ngIf="sortTemplate; else defaultSort"></ng-container>
      <ng-template #defaultSort>
        <span
          [ngClass]="[
            'dv-action',
            sortCustomClass ? sortCustomClass : '',
          ]"
          [class.is-open]="showSortChild"
          (click)="toggleChildView('sort')"
        >
          <verben-svg [width]="15" [icon]="'sort'"></verben-svg>
          <span>Sort</span><span class="dv-count">{{ selectedSortCount }}</span>
        </span>
        <div [style.z-index]="zIndex" class="data-view-element">
          <ng-content
            *ngIf="showSortChild"
            select="[sort-content]"
          ></ng-content>
        </div>
      </ng-template>
    </ng-container>
    <!--Extend Section-->
    <ng-container
      [appOutSideClick]="showExtendChild"
      (outSideClick)="resetChildViewsExcept('extend')"
      *ngIf="viewState.isExtend"
      (click)="stopPropagation($event)"
    >
      <ng-container *ngIf="extendTemplate; else defaultExtend"></ng-container>
      <ng-template #defaultExtend>
        <span
          [ngClass]="[
            'dv-action',
            importCustomClass ? extendCustomClass : '',
          ]"
          [class.is-open]="showExtendChild"
          (click)="toggleChildView('extend')"
        >
          <verben-svg [width]="15" [icon]="'extend'"></verben-svg>
          <span>Extend</span>
        </span>
        <div
          (click)="stopPropagation($event)"
          [style.z-index]="zIndex"
          class="data-view-element"
        >
          <ng-content
            *ngIf="showImportChild"
            select="[extend-content]"
          ></ng-content>
        </div>
      </ng-template>
    </ng-container>
    <!-- Export Section -->
    <ng-container
      [appOutSideClick]="showExportChild"
      (outSideClick)="resetChildViewsExcept('export')"
      *ngIf="viewState.isExport"
    >
      <ng-container *ngIf="exportTemplate; else defaultExport"></ng-container>
      <ng-template #defaultExport>
        <span
          [ngClass]="[
            'dv-action',
            exportCustomClass ? exportCustomClass : '',
          ]"
          [class.is-open]="showExportChild"
          (click)="toggleChildView('export')"
        >
          <verben-svg [width]="15" [icon]="'export'"></verben-svg>
          Export
        </span>
        <div [style.z-index]="zIndex" class="data-view-element">
          <ng-content
            *ngIf="showExportChild"
            select="[export-content]"
          ></ng-content>
        </div>
      </ng-template>
    </ng-container>

    <!-- Select Section -->
    <!-- <div *ngIf="viewState.isSelect">
     <span
       [ngClass]="[
         'flex gap text-xs items-center pd rounded cursor-pointer',
         selectCustomClass ? selectCustomClass : ''
       ]"
       [style.background-color]="'var(--vbn-color-surface-alt)'"
       (click)="toggleChildView('select')"
     >
       <verben-svg [width]="15" [icon]="'select'"></verben-svg>
       <span>Select</span>
       <verben-svg [width]="6" [icon]="'chevron-down'"></verben-svg>
     </span>
   </div> -->

    <!-- Create Button jj-->

    <div
      [appOutSideClick]="create"
      (outSideClick)="resetChildViewsExcept('create')"
      *ngIf="viewState.isCreate"
    >
      <verbena-button
        size="sm"
        [bgColor]="'var(--vbn-color-primary)'"
        [buttonClass]="createCustomClass"
        [textColor]="'var(--vbn-color-on-primary)'"
        [svg]="'add'"
        [svgPosition]="'right'"
        [text]="'Create New'"
        (click)="toggleChildView('create')"
      >
      </verbena-button>
      <ng-container *ngIf="createTemplate; else defaultCreate"></ng-container>
      <ng-template #defaultCreate>
        <div [style.z-index]="zIndex" class="data-view-element">
          <ng-content *ngIf="create" select="[create-content]"></ng-content>
        </div>
      </ng-template>
    </div>
  </div>

  <div>
    <ng-container *ngIf="children; else defaultChildren"></ng-container>
    <ng-template #defaultChildren>
      <div>
        <ng-content select="[children]"></ng-content>
      </div>
    </ng-template>
  </div>
</div>

<!-- Grid and List View Handling -->
<div *ngIf="isTableView; else listViewTemplate">
  <div [style.overflow]="'auto'" [class]="tableClass">
    <ng-content select="[table-content]"></ng-content>
  </div>
</div>
<ng-template #listViewTemplate>
  <div [class]="cardClass">
    <ng-content select="[card-content]"></ng-content>
  </div>
</ng-template>
