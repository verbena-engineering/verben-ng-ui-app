<verben-card
  width="24rem"
  borderRadius="1rem"
  [border]="'1px solid var(--vbn-color-primary)'"
  bgColor="var(--vbn-color-surface)"
  class="export-card"
>
  <div card-header class="card-header">
    <h4 class="header-title">Export</h4>
    <button
      class="reset-button"
      [style.color]="'var(--vbn-color-border-focus)'"
      [style.background-color]="'transparent'"
      [style.border]="'none'"
      [style.cursor]="'pointer'"
      [style.font-size]="'12px'"
      (click)="resetAll()"
    >
      Reset
    </button>
  </div>
  <div card-body class="card-body">
    <section class="section">
      <div class="section-header">
        <h3 class="section-title">Profiles</h3>
        <verben-svg
          icon="info"
          [width]="15"
          [height]="15"
          fill="var(--vbn-color-text-muted)"
        ></verben-svg>
      </div>
      <div *ngFor="let profile of visibleProfiles; let i = index" class="item">
        <div class="item-label">
          <input
            type="checkbox"
            [id]="'profile-' + i"
            [(ngModel)]="profile.selected"
          />
          <label [for]="'profile-' + i" class="checkbox-label">
            {{ profile.name }}
          </label>
        </div>
        <div class="item-actions">
          <verben-svg
            icon="edit"
            [width]="15"
            [height]="15"
            stroke="var(--vbn-color-border-focus)"
            fill="var(--vbn-color-surface)"
            (click)="editProfile(profile)"
          ></verben-svg>
          <verben-svg
            icon="delete"
            [width]="15"
            [height]="15"
            stroke="var(--vbn-color-error)"
            (click)="removeProfile(profile)"
          ></verben-svg>
        </div>
      </div>
      <div
        *ngIf="profiles.length > 3"
        (click)="toggleShowAllProfiles()"
        class="show-more"
      >
        <span>{{ showAllProfiles ? "Show less" : "Show more" }}</span>
        <verben-svg
          icon="chevron"
          [width]="8"
          [height]="6"
          fill="var(--vbn-color-text)"
          stroke="var(--vbn-color-text)"
        ></verben-svg>
      </div>
    </section>
    <hr class="divider" />
    <section class="section">
      <div class="section-header">
        <h3 class="section-title">Group</h3>
        <verben-svg
          icon="info"
          [width]="15"
          [height]="15"
          fill="var(--vbn-color-text-muted)"
        ></verben-svg>
      </div>
      <form [formGroup]="newGroupForm" (ngSubmit)="addGroup()">
        <verbena-input
          placeholder="Group name"
          border="1px solid var(--vbn-color-border)"
          borderRadius="5px"
          textColor="var(--vbn-color-text)"
          width="100%"
          fontSize="11px"
          height="20px"
          pd="2px 4px !important"
          bgColor="transparent"
          [showBorder]="true"
          [showErrorMessage]="true"
          [errorPosition]="'bottom'"
          formControlName="name"
        ></verbena-input>
      </form>
      <div *ngFor="let item of visibleGroups; let i = index" class="item">
        <div class="item-label">
          <input
            type="checkbox"
            [id]="'group-' + i"
            [(ngModel)]="item.selected"
          />
          <label [for]="'group-' + i" class="checkbox-label">
            {{ item.name }}
          </label>
        </div>
        <div class="item-actions" *ngIf="item.type === 'operation'">
          <verben-svg
            icon="edit"
            [width]="15"
            [height]="15"
            stroke="var(--vbn-color-border-focus)"
            fill="var(--vbn-color-surface)"
            (click)="editOperation(item)"
          ></verben-svg>
          <verben-svg
            icon="delete"
            [width]="15"
            [height]="15"
            stroke="var(--vbn-color-error)"
            (click)="removeOperation(item)"
          ></verben-svg>
        </div>
      </div>

      <div class="flex items-center justify-between">
        <button
          *ngIf="groupItems.length > 3"
          (click)="toggleShowAllGroups()"
          class="show-more"
        >
          <span>{{ showAllGroups ? "Show less" : "Show more" }}</span>
          <verben-svg
            icon="chevron"
            [width]="8"
            [height]="6"
            fill="var(--vbn-color-text)"
            stroke="var(--vbn-color-text)"
          ></verben-svg>
        </button>
        <button class="add-button" (click)="addGroup()">+ Add</button>
      </div>
    </section>
    <hr class="divider" />
    <section class="section">
      <div class="section-header">
        <h3 class="section-title">Operation</h3>
        <verben-svg
          icon="info"
          [width]="15"
          [height]="15"
          fill="var(--vbn-color-text-muted)"
        ></verben-svg>
      </div>
      <verbena-input
        placeholder="Operation name"
        border="1px solid var(--vbn-color-border)"
        borderRadius="5px"
        textColor="var(--vbn-color-text)"
        fontSize="11px"
        width="100%"
        height="20px"
        pd="2px 6px"
        bgColor="transparent"
        [showBorder]="true"
        [showErrorMessage]="true"
        [errorPosition]="'bottom'"
        [(ngModel)]="newOperation.name"
      ></verbena-input>

      <div class="operation-grid">
        <!-- First Field Selection -->
        <verben-drop-down
          width="100%"
          height="1.025rem"
          fontSize="11px"
          placeholder="Select field"
          [options]="columnOptions"
          optionLabel="label"
          optionValue="id"
          [(ngModel)]="newOperation.field1"
          (ngModelChange)="onField1Change()"
        >
        </verben-drop-down>

        <!-- Operator/Join Selection -->
        <ng-container *ngIf="newOperation.type === 'arithmetic'">
          <verben-drop-down
            width="100%"
            height="1.025rem"
            placeholder="Select operator"
            [options]="arithmeticOperators"
            optionLabel="label"
            optionValue="value"
            [(ngModel)]="newOperation.operator"
            fontSize="11px"
          >
          </verben-drop-down>
        </ng-container>
        <ng-container *ngIf="newOperation.type === 'string'">
          <verbena-input
            placeholder="Join by"
            border="1px solid var(--vbn-color-border)"
            borderRadius="5px"
            textColor="var(--vbn-color-text)"
            fontSize="11px"
            width="100%"
            height="1.025rem"
            pd="2px 6px"
            bgColor="transparent"
            [showBorder]="true"
            [(ngModel)]="newOperation.joinBy"
          ></verbena-input>
        </ng-container>

        <!-- Second Field Selection -->
        <verben-drop-down
          width="100%"
          height="1.025rem"
          placeholder="Select field"
          [options]="availableFields2"
          optionLabel="label"
          optionValue="id"
          [(ngModel)]="newOperation.field2"
        >
        </verben-drop-down>
      </div>
      <button class="add-button ml-auto" (click)="addOrUpdateOperation()">
        {{ isEditingOperation ? "Update" : "+ Add" }}
      </button>
    </section>

    <section class="section">
      <div class="section-header">
        <h3 class="section-title">Record Size</h3>
      </div>

      <div class="flex gap-4 items-center">
        <verbena-input
          placeholder="Skip"
          border="1px solid var(--vbn-color-border)"
          borderRadius="5px"
          textColor="var(--vbn-color-text)"
          fontSize="11px"
          width="100%"
          height="1.025rem"
          pd="2px 6px"
          bgColor="transparent"
          [showBorder]="true"
          [(ngModel)]="skip"
        ></verbena-input>

        <span>-</span>

        <verbena-input
          placeholder="Limit"
          border="1px solid var(--vbn-color-border)"
          borderRadius="5px"
          textColor="var(--vbn-color-text)"
          fontSize="11px"
          width="100%"
          height="1.025rem"
          pd="2px 6px"
          bgColor="transparent"
          [showBorder]="true"
          [(ngModel)]="limit"
        ></verbena-input>
      </div>
    </section>
  </div>
  <div card-footer class="card-footer">
    <button
      class="export-button"
      [disabled]="!isAnyProfileSelected()"
      (click)="exportData()"
    >
      Export
    </button>
  </div>
</verben-card>
