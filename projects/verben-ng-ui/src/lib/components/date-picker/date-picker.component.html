<div class="vdp-control" cdkOverlayOrigin #origin="cdkOverlayOrigin">
  <button
    #trigger
    type="button"
    class="vdp-field"
    aria-haspopup="dialog"
    [attr.aria-expanded]="open"
    [disabled]="disabled"
    [style.background-color]="bgColor"
    [style.border]="border"
    (click)="toggle()"
  >
    <svg class="vdp-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="4" width="18" height="18" rx="2" /><path d="M16 2v4M8 2v4M3 10h18" />
    </svg>
    <span class="vdp-text" [class.is-placeholder]="!displayText">{{ displayText || placeholder }}</span>
  </button>

  <button *ngIf="clearable && selection && !disabled" type="button" class="vdp-clear" aria-label="Clear" (click)="clear()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
  </button>
</div>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="open"
  [cdkConnectedOverlayPositions]="positions"
  [cdkConnectedOverlayWidth]="overlayWidth ?? ''"
  [cdkConnectedOverlayPush]="true"
  [cdkConnectedOverlayHasBackdrop]="true"
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  (backdropClick)="close()"
  (detach)="close()"
  (overlayKeydown)="onOverlayKeydown($event)"
>
  <div class="vdp-popup" role="dialog" aria-label="Choose a date" [style.width]="datePickerWidth">
    <!-- advanced: Date | Range | Periods tabs -->
    <div class="vdp-modes" *ngIf="variant === 'advanced' && modeList.length > 1" role="group" aria-label="Selection type">
      <button
        *ngFor="let m of modeList"
        type="button"
        [class.is-active]="m === selectionMode"
        [attr.aria-pressed]="m === selectionMode"
        (click)="setMode(m)"
      >
        {{ labelFor(m) }}
      </button>
    </div>

    <!-- simple: one checkbox and one search field -->
    <div class="vdp-top" *ngIf="variant === 'simple'">
      <label class="vdp-check" *ngIf="allowRange" title="Tick to pick a start and an end day">
        <input type="checkbox" [checked]="selectionMode === 'range'" (change)="toggleRange()" />
        Range
      </label>
      <verben-preset-search
        [presets]="presetList"
        [today]="todayDate"
        [min]="min"
        [max]="max"
        [weekStartsOn]="weekStartsOn"
        [allowTyped]="allowTypedPresets"
        [placeholder]="searchPlaceholder"
        (preview)="onPresetPreview($event)"
        (choose)="onPresetChoose($event)"
      ></verben-preset-search>
    </div>

    <div class="vdp-body">
      <!-- Periods: tabs + suggestions on top, period grid on the side, calendar beside it -->
      <verben-period-panel
        *ngIf="selectionMode === 'preset'; else calendar"
        [presets]="presetList"
        [periods]="periods"
        [activeId]="selection?.presetId ?? null"
        [today]="todayDate"
        [min]="min"
        [max]="max"
        [weekStartsOn]="weekStartsOn"
        [focus]="panelFocus"
        [selectedStart]="selection?.start ?? null"
        [selectedEnd]="selection?.end ?? null"
        [multi]="multi"
        (preview)="onPresetPreview($event)"
        (choose)="onPresetChoose($event)"
        (tabChange)="onPeriodTab($event)"
        (spanStartChange)="onSpanStart($event)"
      >
        <ng-container *ngIf="showPeriodCalendar" [ngTemplateOutlet]="calendar"></ng-container>
      </verben-period-panel>
    </div>

    <!-- showTime: hours and minutes for the picked day -->
    <div class="vdp-time" *ngIf="timeOn">
      <span class="vdp-time-label">Time</span>
      <select class="vdp-select" aria-label="Hour" (change)="setTime(+$any($event.target).value, minute)">
        <option *ngFor="let h of hourOptions; let i = index" [value]="h" [selected]="i === hour">{{ h }}</option>
      </select>
      <span aria-hidden="true">:</span>
      <select class="vdp-select" aria-label="Minute" (change)="setTime(hour, +$any($event.target).value)">
        <option *ngFor="let m of minuteOptions; let i = index" [value]="m" [selected]="i === minute">{{ m }}</option>
      </select>
      <button type="button" class="vdp-link" title="00:00" (click)="setTime(0, 0)">Start of day</button>
      <button type="button" class="vdp-link" title="23:59" (click)="setTime(23, 59, true)">End of day</button>
    </div>

    <div class="vdp-footer">
      <!-- Selecting more than one period: one quiet checkbox, off by default -->
      <label class="vdp-check is-muted" *ngIf="selectionMode === 'preset' && allowSeveral && severalLabel">
        <input type="checkbox" [checked]="multi" (change)="toggleMulti()" />
        {{ severalLabel }}
      </label>
      <span class="vdp-hint" [title]="hint">{{ hint }}</span>
      <button *ngIf="selectionMode !== 'preset'" type="button" class="vdp-link" (click)="goToToday()">Today</button>
      <button *ngIf="clearable && selection" type="button" class="vdp-link" (click)="clear()">Clear</button>
      <button type="button" class="vdp-link" (click)="close()">Close</button>
    </div>
  </div>

  <!-- The calendar: alone, or next to the period grid -->
  <ng-template #calendar>
    <verben-calendar
      [(month)]="viewMonth"
      [count]="calendarCount"
      [start]="highlightStart"
      [end]="highlightEnd"
      [min]="min"
      [max]="max"
      [today]="todayDate"
      [weekStartsOn]="weekStartsOn"
      [interactive]="calendarInteractive"
      (pick)="onDayPick($event)"
      (hover)="onDayHover($event)"
    ></verben-calendar>
  </ng-template>
</ng-template>
