<div class="input-container {{ inputContainerClass }}">
    <input
      type="number"
      [value]="value"
      (input)="onInput($event)"
      [min]="min"
      [max]="max"
      [step]="step"
      (blur)="validateValue()"
      class="input-field verben-input {{ inputWrapperClass }}"
    />

  </div>
  <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>
