<div
  class="input-container {{ inputContainerClass }}"
  [ngStyle]="{
    'display': 'flex',
    'flex-direction': 'column'
  }"
>
  <div
    [ngStyle]="{
      'width': '100%',
      'display': 'flex',
      'justify-content': 'space-between'
    }"
  >
    <label [for]="label">{{ label }}</label>
  </div>

  <input
    type="number"
    [value]="value"
    (input)="onInput($event)"
    [min]="min"
    [max]="max"
    [step]="step"
    [disabled]="disabled" 
    (blur)="validateValue()"
    class="input-field verben-input {{ inputWrapperClass }}"
  />
</div>

<p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>
