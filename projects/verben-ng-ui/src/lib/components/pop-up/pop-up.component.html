<span class="relative dropdown-container" [ngStyle]="dropdownStyles">
  <span
    (click)="toggleDropdown()"
    cdkOverlayOrigin
    #trigger="cdkOverlayOrigin"
    class="dropdown-menu"
  >
    <ng-content select="[dropdown-trigger]"></ng-content>
  </span>

  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayLockPosition]="false"
    [cdkConnectedOverlayOrigin]="trigger"
    [cdkConnectedOverlayPositions]="
      cdkPosition ? cdkPosition : defaultPositions
    "
    [cdkConnectedOverlayOpen]="dropdownOpen"
    (detach)="dropdownOpen = false"
  >
    <div
      #expansion
      (mouseleave)="onMouseOut()"
      [attr.aria-hidden]="!dropdownOpen"
      class="{{ popUpClass }}"
      [ngStyle]="yourStyles"
    >
      <ng-content select="[dropdown-content]"></ng-content>
    </div>
  </ng-template>
</span>
