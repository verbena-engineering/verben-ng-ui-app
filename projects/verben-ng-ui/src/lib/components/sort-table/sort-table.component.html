<div
  [style.background-color]="bgColor"
  [style.box-shadow]="boxShadow"
  [style.border]="border"
  [style.border-radius]="borderRadius"
  [style.color]="textColor"
  [style.width]="width"
  [style.height]="height"
  [style.padding]="pd"
  class="sort-wrapper vbn-panel"
>
  <!-- Header Section -->
  <div class="vbn-panel-header">
    <span class="vbn-panel-title">
      Sort
      <span class="vbn-panel-count" [style.color]="secondaryColor">{{ countSelectedSorts() }}</span>
    </span>
    <button type="button" class="vbn-panel-link" [style.color]="secondaryColor" (click)="resetSort()">
      {{ resetText }}
    </button>
  </div>

  <!-- Sort Options (Scrollable Section) -->
  <div class="sort-options">
    <p class="vbn-panel-label">{{ propertyText }}</p>

    <label class="vbn-panel-row vbn-panel-row--all">
      <input type="checkbox" [checked]="checkAll" (change)="toggleSelectAll()" />
      Select All
    </label>

    <div
      *ngFor="let option of visibleSortOptions; let i = index"
      [attr.draggable]="enableDragAndDrop"
      (dragstart)="onDragStart(i, $event)"
      (dragover)="onDragOver($event)"
      (drop)="onDrop(i, $event)"
      class="sort-option"
      [class.is-checked]="option.checked"
    >
      <div class="sort-option-main">
        <verben-svg
          *ngIf="enableDragAndDrop"
          fill="var(--vbn-color-text-muted)"
          [width]="18"
          class="vbn-panel-handle"
          icon="square-dot"
        ></verben-svg>
        <label class="vbn-panel-row">
          <input type="checkbox" [checked]="option.checked" (change)="toggleSort(i)" />
          <span>{{ option.name }}</span>
        </label>
      </div>

      <!-- Sorting Controls: a small segmented choice -->
      <div class="sort-order" role="radiogroup" [attr.aria-label]="option.name + ' order'">
        <ng-container *ngIf="option.type === 'Number'">
          <label class="sort-order-option">
            <input
              type="radio"
              name="sortOrder{{ i }}"
              value="asc"
              [checked]="selectedOrders.get(i) === 'asc'"
              [disabled]="!option.checked"
              (change)="setSortOrder(i, 'asc')"
            />
            1-100
          </label>
          <label class="sort-order-option">
            <input
              type="radio"
              name="sortOrder{{ i }}"
              value="desc"
              [checked]="selectedOrders.get(i) === 'desc'"
              [disabled]="!option.checked"
              (change)="setSortOrder(i, 'desc')"
            />
            100-1
          </label>
        </ng-container>
        <ng-container *ngIf="option.type === 'String' || option.type === 'Date'">
          <label class="sort-order-option">
            <input
              type="radio"
              name="sortOrder{{ i }}"
              value="asc"
              [checked]="selectedOrders.get(i) === 'asc'"
              [disabled]="!option.checked"
              (change)="setSortOrder(i, 'asc')"
            />
            A-Z
          </label>
          <label class="sort-order-option">
            <input
              type="radio"
              name="sortOrder{{ i }}"
              value="desc"
              [checked]="selectedOrders.get(i) === 'desc'"
              [disabled]="!option.checked"
              (change)="setSortOrder(i, 'desc')"
            />
            Z-A
          </label>
        </ng-container>
      </div>
    </div>

    <!-- Show More -->
    <button
      *ngIf="showMore && hiddenSortOptions.length > 0"
      type="button"
      class="vbn-panel-link vbn-panel-more"
      (click)="toggleShowMore()"
    >
      {{ showMoreText }}
    </button>
  </div>

  <!-- Sort Button -->
  <div class="vbn-panel-footer">
    <button
      type="button"
      class="vbn-panel-primary"
      [style.background-color]="primaryColor"
      [style.color]="tertiaryColor"
      (click)="applySort()"
    >
      {{ sortButtonText }}
    </button>
  </div>
</div>
