<section
  [style.background-color]="bgColor"
  [style.box-shadow]="boxShadow"
  [style.border]="border"
  [style.border-radius]="borderRadius"
  [style.color]="textColor"
  [style.width]="width"
  [style.height]="height"
  [style.padding]="pd"
  class="vbn-panel"
>
  <div class="vbn-panel-header">
    <h3 class="vbn-panel-title" [style.color]="tertiaryColor">
      Filters
      <span class="vbn-panel-count" [style.color]="secondaryColor">{{ filterCount }}</span>
    </h3>
    <button type="button" class="vbn-panel-link" [style.color]="secondaryColor" (click)="resetFilters()">
      Reset
    </button>
  </div>

  <!-- Saved Filters Section -->
  <div class="vbn-panel-scroll">
    <div class="filter-section-title">
      <p class="vbn-panel-label">Saved Filters</p>
      <verben-svg icon="info" [width]="14" [height]="14" fill="var(--vbn-color-text-muted)"></verben-svg>
    </div>

    <p class="filter-empty" *ngIf="!savedFilters.length">No saved filters yet. Add one below.</p>

    <label class="vbn-panel-row vbn-panel-row--all" *ngIf="savedFilters.length">
      <input type="checkbox" [checked]="checkAll" (change)="toggleSelectAll()" />
      Select All
    </label>

    <div *ngFor="let filter of visibleFilters; let i = index" class="filter-item">
      <label class="vbn-panel-row">
        <input type="checkbox" [checked]="filter.checked" (click)="toggleCheckbox(i)" />
        <span class="filter-text" [style.color]="tertiaryColor">
          <b>{{ filter.name }}</b> {{ filter.condition }} <b>{{ filter.value }}</b>
        </span>
      </label>
      <div class="filter-actions">
        <button type="button" class="filter-icon" aria-label="Edit filter" title="Edit" (click)="editFilter(i)">
          <verben-svg
            icon="pencil"
            [width]="14"
            [height]="14"
            stroke="var(--vbn-color-text-muted)"
            fill="var(--vbn-color-text-muted)"
          ></verben-svg>
        </button>
        <button type="button" class="filter-icon is-danger" aria-label="Delete filter" title="Delete" (click)="deleteFilter(i)">
          <verben-svg icon="trash" [width]="14" [height]="14" stroke="var(--vbn-color-error)"></verben-svg>
        </button>
      </div>
    </div>

    <button
      type="button"
      class="vbn-panel-link vbn-panel-more filter-more"
      *ngIf="savedFilters.length > maxFilterLength"
      [style.color]="tertiaryColor"
      (click)="toggleShowMore()"
    >
      {{ showAllFilters ? "Show less" : "Show more" }}
      <verben-svg
        icon="chevron"
        [width]="8"
        [height]="6"
        [class.is-open]="showAllFilters"
        fill="currentColor"
        stroke="currentColor"
      ></verben-svg>
    </button>
  </div>

  <!-- Operation Section -->
  <div class="filter-operation">
    <div class="filter-section-title">
      <p class="vbn-panel-label">Operation</p>
      <div class="filter-info">
        <verben-tooltip
          [tooltipContent]="tooltipTemplate"
          [backgroundColor]="'var(--vbn-color-surface-alt)'"
          width="200px"
          [top]="'20px'"
          [right]="'0px'"
        >
          <verben-svg icon="info" [width]="14" [height]="14" *ngIf="isDuplicateFilter" fill="var(--vbn-color-error)">
          </verben-svg>
        </verben-tooltip>

        <ng-template #tooltipTemplate>
          {{ duplicateMessage }}
        </ng-template>
        <verben-svg
          icon="info"
          [width]="14"
          [height]="14"
          fill="var(--vbn-color-text-muted)"
          *ngIf="!isDuplicateFilter"
        ></verben-svg>
      </div>
    </div>

    <!-- Field, condition and value; they wrap on narrow screens -->
    <div class="inputsWrapper">
      <verben-drop-down
        width="100%"
        placeholder="Field"
        [options]="filterArray"
        [(ngModel)]="selectedFilterValue"
        (ngModelChange)="onFilterNameChange(selectedFilterValue)"
      >
      </verben-drop-down>
      <verben-drop-down
        width="100%"
        placeholder="Condition"
        [options]="conditionOptions"
        (onChange)="checkDuplicateFilter()"
        [(ngModel)]="selectedCondition"
      >
      </verben-drop-down>

      <verbena-input
        *ngIf="selectedFilterType === 'Date'"
        border="1px solid var(--vbn-color-border)"
        borderRadius="8px"
        textColor="var(--vbn-color-text)"
        [showBorder]="true"
        [showErrorMessage]="true"
        [errorPosition]="'bottom'"
        [type]="'date'"
        [(ngModel)]="inputValue"
      ></verbena-input>

      <verbena-input
        *ngIf="selectedFilterType === 'Credit' || selectedFilterType === 'Integer'"
        border="1px solid var(--vbn-color-border)"
        borderRadius="8px"
        textColor="var(--vbn-color-text)"
        placeHolder="Whole number"
        [showBorder]="true"
        [showErrorMessage]="true"
        [errorPosition]="'bottom'"
        appValidate="integer"
        [(ngModel)]="inputValue"
      ></verbena-input>

      <verbena-input
        *ngIf="selectedFilterType === 'Decimal'"
        border="1px solid var(--vbn-color-border)"
        borderRadius="8px"
        textColor="var(--vbn-color-text)"
        placeHolder="Decimal"
        [showBorder]="true"
        [showErrorMessage]="false"
        [errorPosition]="'bottom'"
        appValidate="decimal"
        [(ngModel)]="inputValue"
      ></verbena-input>

      <verbena-input
        *ngIf="selectedFilterType === 'Number'"
        border="1px solid var(--vbn-color-border)"
        borderRadius="8px"
        textColor="var(--vbn-color-text)"
        placeHolder="Number"
        [showBorder]="true"
        [showErrorMessage]="false"
        type="number"
        [errorPosition]="'bottom'"
        appValidate="number"
        [(ngModel)]="inputValue"
      ></verbena-input>

      <verbena-input
        *ngIf="
          selectedFilterType !== 'Credit' &&
          selectedFilterType !== 'Date' &&
          selectedFilterType !== 'Integer' &&
          selectedFilterType !== 'Decimal' &&
          selectedFilterType !== 'Number'
        "
        border="1px solid var(--vbn-color-border)"
        placeHolder="Value"
        borderRadius="8px"
        textColor="var(--vbn-color-text)"
        [showBorder]="true"
        [showErrorMessage]="true"
        [errorPosition]="'bottom'"
        [(ngModel)]="inputValue"
      ></verbena-input>
    </div>

    <div class="filter-add">
      <button
        type="button"
        class="vbn-panel-link"
        [style.color]="secondaryColor"
        [disabled]="disableAddFilterBtn"
        (click)="addFilter()"
      >
        {{ this.editIndex != null ? "+ Update filter" : "+ Add filter" }}
      </button>
    </div>
  </div>

  <div class="vbn-panel-footer">
    <button
      type="button"
      class="vbn-panel-primary"
      [style.background-color]="primaryColor"
      [style.color]="tertiaryColor"
      (click)="applyFilters()"
    >
      Confirm
    </button>
  </div>
</section>
