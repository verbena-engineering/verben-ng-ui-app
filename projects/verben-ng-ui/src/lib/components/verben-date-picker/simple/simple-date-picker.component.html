<div class="vsp-control" cdkOverlayOrigin #origin="cdkOverlayOrigin">
  <button
    #trigger
    type="button"
    class="vsp-field"
    aria-haspopup="dialog"
    [attr.aria-expanded]="open"
    [disabled]="disabled"
    (click)="toggle()"
  >
    <svg class="vsp-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="4" width="18" height="18" rx="2" /><path d="M16 2v4M8 2v4M3 10h18" />
    </svg>
    <span class="vsp-text" [class.is-placeholder]="!displayText">{{ displayText || placeholder }}</span>
  </button>
  <button *ngIf="clearable && selection && !disabled" type="button" class="vsp-clear" aria-label="Clear" (click)="clear()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
  </button>
</div>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="open"
  [cdkConnectedOverlayPositions]="positions"
  [cdkConnectedOverlayPush]="true"
  [cdkConnectedOverlayHasBackdrop]="true"
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  (backdropClick)="close()"
  (detach)="close()"
  (overlayKeydown)="onOverlayKeydown($event)"
>
  <div class="vsp-popup" role="dialog" aria-label="Choose a date">
    <!-- One row: the Range checkbox and the preset combobox -->
    <div class="vsp-top">
      <label class="vsp-range" *ngIf="allowRange" title="Tick to pick a start and an end day">
        <input type="checkbox" [checked]="rangeMode" (change)="toggleRange()" />
        Range
      </label>

      <div class="vsp-combo">
        <svg class="vsp-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" />
        </svg>
        <input
          type="text"
          class="vsp-search"
          role="combobox"
          autocomplete="off"
          aria-autocomplete="list"
          aria-label="Search presets"
          [attr.aria-expanded]="listOpen"
          [attr.aria-controls]="listId"
          [attr.aria-activedescendant]="listOpen && activeIndex >= 0 ? listId + '-' + activeIndex : null"
          [placeholder]="searchPlaceholder"
          [value]="query"
          (input)="onQueryInput($any($event.target).value)"
          (focus)="onSearchFocus()"
          (blur)="onSearchBlur()"
          (keydown)="onSearchKeydown($event)"
        />
      </div>

      <!-- The list floats over the calendar while the combobox is in use -->
      <ul *ngIf="listOpen" class="vsp-list" role="listbox" [id]="listId" aria-label="Presets">
        <li
          *ngFor="let option of options; let i = index; trackBy: trackByOption"
          role="option"
          class="vsp-option"
          [id]="listId + '-' + i"
          [class.is-active]="i === activeIndex"
          [class.is-disabled]="option.disabled"
          [attr.aria-selected]="i === activeIndex"
          [attr.aria-disabled]="option.disabled"
          (mousedown)="$event.preventDefault()"
          (mouseenter)="setActive(i)"
          (click)="chooseOption(option)"
        >
          <span class="vsp-option-label">{{ option.preset.label }}</span>
          <span class="vsp-tag" *ngIf="option.tag">{{ option.tag }}</span>
          <span class="vsp-option-dates">{{ option.dates }}</span>
        </li>
        <li *ngIf="!options.length" class="vsp-empty">
          No match. Try “last 3 months”, “Q2 2025” or “2024”.
        </li>
      </ul>
    </div>

    <!-- Calendar: day view (one or two months) or month / year view -->
    <div class="vsp-months" *ngIf="view === 'days'; else monthView">
      <div class="vsp-month" *ngFor="let m of visibleMonths; let first = first; let last = last; trackBy: trackByMonth">
        <div class="vsp-caption">
          <button *ngIf="first" type="button" class="vsp-nav" aria-label="Previous month" (click)="shiftMonth(-1)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
          </button>
          <span *ngIf="!first"></span>
          <button type="button" class="vsp-caption-label" title="Choose month and year" (click)="view = 'months'">{{ m.caption }}</button>
          <button *ngIf="last" type="button" class="vsp-nav" aria-label="Next month" (click)="shiftMonth(1)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
          </button>
          <span *ngIf="!last"></span>
        </div>
        <verben-calendar-grid
          [month]="m.date"
          [weekStartsOn]="weekStartsOn"
          [start]="highlightStart"
          [end]="highlightEnd"
          [min]="min"
          [max]="max"
          [today]="todayDate"
          (pick)="onDayPick($event)"
          (hover)="onDayHover($event)"
        ></verben-calendar-grid>
      </div>
    </div>

    <ng-template #monthView>
      <div class="vsp-month-view">
        <div class="vsp-caption">
          <button type="button" class="vsp-nav" aria-label="Previous year" (click)="shiftYear(-1)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
          </button>
          <button type="button" class="vsp-caption-label" (click)="view = 'days'">{{ viewMonth.getFullYear() }}</button>
          <button type="button" class="vsp-nav" aria-label="Next year" (click)="shiftYear(1)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
          </button>
        </div>
        <div class="vsp-month-grid">
          <button
            *ngFor="let cell of monthCells"
            type="button"
            class="vsp-month-cell"
            [class.is-current]="cell.current"
            [disabled]="cell.disabled"
            (click)="pickMonth(cell.index)"
          >
            {{ cell.label }}
          </button>
        </div>
      </div>
    </ng-template>

    <div class="vsp-footer">
      <span class="vsp-hint">{{ hint }}</span>
      <button type="button" class="vsp-link" (click)="goToToday()">Today</button>
      <button *ngIf="clearable && selection" type="button" class="vsp-link" (click)="clear()">Clear</button>
      <button type="button" class="vsp-link" (click)="close()">Close</button>
    </div>
  </div>
</ng-template>
