<div class="vdp-control" cdkOverlayOrigin #origin="cdkOverlayOrigin">
  <button
    #trigger
    type="button"
    class="vdp-field"
    aria-haspopup="dialog"
    [attr.aria-expanded]="open"
    [disabled]="disabled"
    (click)="toggle()"
  >
    <svg class="vdp-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="4" width="18" height="18" rx="2" /><path d="M16 2v4M8 2v4M3 10h18" />
    </svg>
    <span class="vdp-text" [class.is-placeholder]="!displayText">
      {{ displayText || placeholder }}
    </span>
  </button>

  <button
    *ngIf="clearable && selection && !disabled"
    type="button"
    class="vdp-clear"
    aria-label="Clear"
    (click)="clear()"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <path d="M18 6 6 18M6 6l12 12" />
    </svg>
  </button>
</div>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="open"
  [cdkConnectedOverlayPositions]="positions"
  [cdkConnectedOverlayPush]="true"
  [cdkConnectedOverlayHasBackdrop]="true"
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  (backdropClick)="close()"
  (detach)="close()"
  (overlayKeydown)="onOverlayKeydown($event)"
>
  <div class="vdp-popup" role="dialog" aria-label="Choose a date">
    <!-- Mode switcher: only when the user may change what is picked -->
    <div class="vdp-modes" *ngIf="modeList.length > 1" role="group" aria-label="Selection type">
      <button
        *ngFor="let m of modeList"
        type="button"
        [class.is-active]="m === mode"
        [attr.aria-pressed]="m === mode"
        (click)="setMode(m)"
      >
        {{ labelFor(m) }}
      </button>
    </div>

    <div class="vdp-body">
      <!-- Periods: tabs + suggestions on top, period grid on the side, calendar beside it -->
      <verben-period-panel
        *ngIf="mode === 'preset'"
        [presets]="presetList"
        [periods]="periods"
        [activeId]="selection?.presetId ?? null"
        [today]="todayDate"
        [min]="min"
        [max]="max"
        [weekStartsOn]="weekStartsOn"
        [focus]="panelFocus"
        [selectedStart]="selection?.start ?? null"
        [selectedEnd]="selection?.end ?? null"
        [multi]="multi"
        (preview)="onPresetPreview($event)"
        (choose)="onPresetChoose($event)"
        (tabChange)="onPeriodTab($event)"
        (spanStartChange)="onSpanStart($event)"
      >
        <ng-container *ngIf="showPeriodCalendar" [ngTemplateOutlet]="calendar"></ng-container>
      </verben-period-panel>

      <ng-container *ngIf="mode !== 'preset'" [ngTemplateOutlet]="calendar"></ng-container>
    </div>

    <div class="vdp-footer">
      <!-- Selecting more than one period: one quiet checkbox, off by default -->
      <label class="vdp-several" *ngIf="mode === 'preset' && allowSeveral && severalLabel">
        <input type="checkbox" [checked]="multi" (change)="toggleMulti()" />
        {{ severalLabel }}
      </label>
      <span class="vdp-hint">{{ hint }}</span>
      <button *ngIf="mode !== 'preset'" type="button" class="vdp-link" (click)="goToToday()">Today</button>
      <button *ngIf="clearable && selection" type="button" class="vdp-link" (click)="clear()">Clear</button>
      <button type="button" class="vdp-link" (click)="close()">Close</button>
    </div>
  </div>

  <!-- The calendar: shown alone (Date / Range) or next to the period grid -->
  <ng-template #calendar>
    <div class="vdp-calendar">
      <!-- Day view: one or two months -->
      <div class="vdp-months" *ngIf="view === 'days'; else monthView">
        <div class="vdp-month" *ngFor="let m of visibleMonths; let first = first; let last = last; trackBy: trackByMonth">
          <div class="vdp-caption">
            <button *ngIf="first" type="button" class="vdp-nav" aria-label="Previous month" (click)="shiftMonth(-1)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
            </button>
            <span *ngIf="!first"></span>
            <button type="button" class="vdp-caption-label" title="Choose month and year" (click)="view = 'months'">
              {{ m.caption }}
            </button>
            <button *ngIf="last" type="button" class="vdp-nav" aria-label="Next month" (click)="shiftMonth(1)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
            </button>
            <span *ngIf="!last"></span>
          </div>
          <!-- In Periods mode only the Daily tab picks on the calendar; other tabs preview -->
          <verben-calendar-grid
            [month]="m.date"
            [weekStartsOn]="weekStartsOn"
            [start]="highlightStart"
            [end]="highlightEnd"
            [min]="min"
            [max]="max"
            [today]="todayDate"
            [interactive]="calendarInteractive"
            (pick)="onDayPick($event)"
            (hover)="onDayHover($event)"
          ></verben-calendar-grid>
        </div>
      </div>

      <!-- Month view: jump to any month / year -->
      <ng-template #monthView>
        <div class="vdp-month-view">
          <div class="vdp-caption">
            <button type="button" class="vdp-nav" aria-label="Previous year" (click)="shiftYear(-1)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
            </button>
            <button type="button" class="vdp-caption-label" (click)="view = 'days'">
              {{ viewMonth.getFullYear() }}
            </button>
            <button type="button" class="vdp-nav" aria-label="Next year" (click)="shiftYear(1)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
            </button>
          </div>
          <div class="vdp-month-grid">
            <button
              *ngFor="let cell of monthCells"
              type="button"
              class="vdp-month-cell"
              [class.is-current]="cell.current"
              [disabled]="cell.disabled"
              (click)="pickMonth(cell.index)"
            >
              {{ cell.label }}
            </button>
          </div>
        </div>
      </ng-template>
    </div>
  </ng-template>
</ng-template>
