<div
  [style.background-color]="bgColor"
  [style.box-shadow]="boxShadow"
  [style.border]="border"
  [style.border-radius]="borderRadius"
  [style.color]="textColor"
  [style.width]="width"
  [style.height]="height"
  [style.padding]="pd"
  class="column-control vbn-panel"
>
  <div class="vbn-panel-header">
    <span class="vbn-panel-title">
      Column <span class="vbn-panel-count" [style.color]="secondaryColor">{{ getSelectedColumnCount() }}</span>
    </span>
    <button type="button" class="vbn-panel-link" [style.color]="secondaryColor" (click)="resetColumns()">Reset</button>
  </div>

  <!-- Select All Checkbox -->
  <label class="vbn-panel-row vbn-panel-row--all">
    <input type="checkbox" [checked]="selectAll" (change)="toggleSelectAll()" />
    Select All
  </label>

  <div class="vbn-panel-scroll">
    <ul class="column-options-container">
      <ng-container *ngFor="let column of columns; let i = index">
        <li
          *ngIf="i < displayedColumns"
          [attr.draggable]="enableDragAndDrop"
          (dragstart)="onDragStart(i, $event)"
          (dragover)="onDragOver($event)"
          (drop)="onDrop(i, $event)"
          class="column-option"
        >
          <verben-svg
            *ngIf="enableDragAndDrop"
            fill="var(--vbn-color-text-muted)"
            [width]="18"
            class="vbn-panel-handle"
            icon="square-dot"
          ></verben-svg>
          <label class="vbn-panel-row">
            <input type="checkbox" [(ngModel)]="visibleColumns[i]" (ngModelChange)="updateSelectAllStatus()" />
            {{ column.name }}
          </label>
        </li>
      </ng-container>
    </ul>

    <!-- Show More / Show Less -->
    <button
      *ngIf="displayedColumns <= columns.length"
      type="button"
      class="vbn-panel-link vbn-panel-more"
      (click)="toggleShowMore()"
    >
      {{ displayedColumns === columns.length ? "Show Less" : "Show More" }}
    </button>
  </div>

  <!-- Save Button -->
  <div class="vbn-panel-footer">
    <button
      type="button"
      class="vbn-panel-primary"
      [style.background-color]="primaryColor"
      [style.color]="tertiaryColor"
      [disabled]="getSelectedColumnCount() === 0"
      (click)="saveColumnVisibility()"
    >
      Save
    </button>
  </div>
</div>
