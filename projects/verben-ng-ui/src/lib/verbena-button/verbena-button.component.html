<button
  [attr.type]="type || 'button'"
  class="verbena-button vbn-btn vbn-btn--{{ styleType }} vbn-btn--{{ size }} {{ buttonClass }}"
  [class.vbn-btn--block]="block"
  [class.is-loading]="isLoading"
  [disabled]="isDisabled"
  [attr.aria-busy]="isLoading ? true : null"
  [style.--_bg]="bgColor || null"
  [style.--_fg]="textColor || null"
  [style.--_border]="border || null"
  [style.--_radius]="borderRadius || null"
  [style.--_pad]="pd || null"
  [style.--_h]="height || null"
  [style.width]="width || null"
  [style.height]="height || null"
  [style.font-size]="fontSize || null"
  [style.font-weight]="fontWeight || null"
>
  <span
    *ngIf="isLoading"
    class="vbn-btn-spinner"
    aria-hidden="true"
    [style.width]="spinnerSize || null"
    [style.height]="spinnerSize || null"
    [style.--_spin]="spinnerColor || null"
  ></span>

  <ng-container *ngIf="!isLoading" [ngTemplateOutlet]="iconTpl" [ngTemplateOutletContext]="{ $implicit: 'left' }"></ng-container>

  <span *ngIf="text" class="vbn-btn-label {{ buttonTextClass }}">{{ text }}</span>
  <!-- Projected label: <verbena-button>Save</verbena-button> -->
  <span class="vbn-btn-content"><ng-content></ng-content></span>

  <ng-container *ngIf="!isLoading" [ngTemplateOutlet]="iconTpl" [ngTemplateOutletContext]="{ $implicit: 'right' }"></ng-container>
</button>

<ng-template #iconTpl let-side>
  <verben-svg
    *ngIf="!useIcon && svg && svgPosition === side"
    class="vbn-btn-icon"
    [icon]="svg"
    [width]="svgWidth"
    [height]="svgHeight"
    [size]="svgSize"
    [stroke]="svgColor || 'currentColor'"
  ></verben-svg>
  <verbena-icon
    *ngIf="useIcon && icon && iconPosition === side"
    class="vbn-btn-icon"
    [icon]="icon"
    [variant]="variant"
    [size]="svgSize"
    [weight]="weight"
    [color]="svgColor || iconColor"
  ></verbena-icon>
</ng-template>
