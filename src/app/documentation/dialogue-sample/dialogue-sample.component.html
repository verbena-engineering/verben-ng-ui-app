<p class="demo-intro">
  <code>verben-dialogue</code> shows a header, body and footer from your own
  templates, over the page. It closes with the close icon, Escape or a click
  outside. Here the body holds a filter panel.
</p>
<verbena-button text="Open dialog" styleType="secondary" (click)="openModal()"></verbena-button>

<!-- Modal Component -->
<verben-dialogue
  [showCloseIcon]="true"
  [dismissOutsideClick]="true"
  [closeOnEscape]="true"
  [mode]="'dialogue'"
  [size]="'large'"
  [customClass]="'my-modal-custom-class'"
  [disableFooter]="false"
  [modalData]="[{ data: { first_name: 'verben-ng', last_name: 'verbena' } }]"
  [isVisible]="isModalVisible"
  [headerTemplate]="headerTemplate"
  [bodyTemplate]="bodyTemplate"
  [footerTemplate]="footerTemplate"
  (openModal)="onModalOpen($event)"
  (closeModal)="onModalClose($event)"
></verben-dialogue>

<!-- Define templates -->
<ng-template #headerTemplate>
  <h2 class="demo-dialog-title">Filter invoices</h2>
</ng-template>

<ng-template #bodyTemplate>
  <p class="demo-dialog-text">Pick the filters to apply to the list.</p>
  <verben-table-filter width="100%" [filterOptions]="filterArray" [maxFilterLength]="3"></verben-table-filter>
</ng-template>

<ng-template #footerTemplate>
  <div class="demo-dialog-actions">
    <verbena-button text="Cancel" styleType="outline" (click)="onModalClose($event)"></verbena-button>
    <verbena-button text="Apply" styleType="secondary" (click)="onConfirm()"></verbena-button>
  </div>
</ng-template>
