<div class="docs-root">
  <header class="docs-header">
    <div class="docs-header-inner">
      <button
        type="button"
        class="docs-icon-btn docs-menu-btn"
        (click)="navOpen = !navOpen"
        [attr.aria-expanded]="navOpen"
        aria-controls="docs-sidebar"
        aria-label="Toggle navigation"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>

      <a routerLink="/documentation" class="docs-logo">
        <span class="docs-logo-mark">V</span>
        verben-ng-ui
        <span class="docs-version">v1.4.4</span>
      </a>

      <nav class="docs-header-nav" aria-label="Main">
        <a routerLink="/documentation/installation" routerLinkActive="is-active">Docs</a>
        <a routerLink="/documentation" fragment="components">Components</a>
        <a routerLink="/documentation/theming" routerLinkActive="is-active">Theming</a>
      </nav>

      <div class="docs-header-actions">
        <a class="docs-icon-btn" [href]="repoUrl" target="_blank" rel="noopener" aria-label="GitHub repository">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.42-2.7 5.4-5.26 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5Z" />
          </svg>
        </a>
        <button
          type="button"
          class="docs-icon-btn"
          (click)="toggleTheme()"
          [attr.aria-label]="isDark ? 'Switch to light mode' : 'Switch to dark mode'"
        >
          <svg *ngIf="!isDark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
          </svg>
          <svg *ngIf="isDark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div class="docs-layout">
    <aside id="docs-sidebar" class="docs-sidebar" [class.is-open]="navOpen" aria-label="Documentation">
      <input
        class="docs-sidebar-search"
        type="search"
        placeholder="Search docs…"
        aria-label="Search docs"
        [(ngModel)]="query"
      />

      <div class="docs-nav-group" *ngFor="let group of filteredGroups">
        <p class="docs-nav-title">{{ group.title }}</p>
        <a
          *ngFor="let item of group.items"
          class="docs-nav-link"
          [routerLink]="item.route"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          {{ item.title }}
          <span *ngIf="item.status === 'unstable'" class="docs-tag-unstable">unstable</span>
          <span *ngIf="item.status === 'new'" class="docs-tag-new">new</span>
        </a>
      </div>
      <p class="docs-nav-empty" *ngIf="filteredGroups.length === 0">
        No results for “{{ query }}”.
      </p>
    </aside>

    <div class="docs-backdrop" [class.is-open]="navOpen" (click)="navOpen = false"></div>

    <main class="docs-main" [class.is-wide]="isWide">
      <div class="docs-content">
        <router-outlet></router-outlet>
      </div>

      <nav class="docs-toc" *ngIf="!isWide && toc.length > 1" aria-label="On this page">
        <p>On this page</p>
        <a
          *ngFor="let entry of toc"
          [href]="'#' + entry.id"
          [class.is-sub]="entry.sub"
          [class.is-active]="entry.id === activeId"
          (click)="scrollTo(entry.id, $event)"
        >
          {{ entry.text }}
        </a>
      </nav>
    </main>
  </div>
</div>
