<docs-page title="Input" description="A text field with label, validation messages, password toggle and text formatting.">
  <docs-example [code]="snippets.basic" direction="column">
    <div class="docs-stack">
      <verbena-input label="Email" type="email" placeHolder="name@company.com" [(ngModel)]="email"></verbena-input>
      <span class="docs-output">email: "{{ email }}"</span>
    </div>
  </docs-example>

  <h2 class="docs-h2" id="usage">Usage</h2>
  <p class="docs-p">
    Import <code class="docs-inline-code">VerbenaInputModule</code> and
    <code class="docs-inline-code">FormsModule</code>. Works with
    <code class="docs-inline-code">[(ngModel)]</code> and reactive
    <code class="docs-inline-code">formControlName</code>.
  </p>

  <h2 class="docs-h2" id="examples">Examples</h2>

  <docs-example title="Password" [code]="snippets.password">
    <div class="docs-stack">
      <verbena-input label="Password" type="password" placeHolder="At least 8 characters" [passwordToggle]="true" [(ngModel)]="password"></verbena-input>
    </div>
  </docs-example>

  <docs-example title="Validation" description="Errors appear as you type; clear the field to see the custom required message." [code]="snippets.validation">
    <div class="docs-stack">
      <verbena-input
        label="Username"
        placeHolder="Type, then clear the field"
        [required]="true"
        [minLength]="3"
        [customErrorMessages]="{ required: 'Pick a username.' }"
        [(ngModel)]="username"
      ></verbena-input>
    </div>
  </docs-example>

  <docs-example title="Capitalization" [code]="snippets.capitalization">
    <div class="docs-stack">
      <verbena-input label="Voucher code" placeHolder="Typed text becomes uppercase" capitalization="uppercase" [(ngModel)]="code"></verbena-input>
    </div>
  </docs-example>

  <docs-example title="Disabled and read-only" [code]="snippets.disabled">
    <div class="docs-stack">
      <verbena-input label="Company" value="Verbena Logic" [disabled]="true"></verbena-input>
      <verbena-input label="Reference" value="INV-0042" [readOnly]="true"></verbena-input>
    </div>
  </docs-example>

  <h2 class="docs-h2" id="api">API</h2>
  <docs-props-table [props]="inputs"></docs-props-table>
  <docs-props-table [props]="outputs" kind="output"></docs-props-table>
</docs-page>
