<docs-page title="Notification" description="Short toast messages, triggered from anywhere with NotificationService.">
  <verben-notification position="top-right" width="380px"></verben-notification>

  <docs-example [code]="code.basic" [tsCode]="code.basicTs">
    <verbena-button text="Success" styleType="outline" (click)="success()"></verbena-button>
    <verbena-button text="Error" styleType="outline" (click)="error()"></verbena-button>
    <verbena-button text="Warning" styleType="outline" (click)="warning()"></verbena-button>
    <verbena-button text="Info" styleType="outline" (click)="info()"></verbena-button>

    <li>Inject <code class="docs-inline-code">NotificationService</code> wherever you need to show a message.</li>
  </ol>
