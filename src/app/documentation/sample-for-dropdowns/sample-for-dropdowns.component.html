<p class="demo-intro">
  <code>verben-pop-Up</code> inside a scrolling area: open a pop-up, then
  scroll the box in both directions. The pop-up stays attached to its button.
</p>

<section class="main-sec">
  <div class="scroll-space">
    <verben-pop-Up
      [(dropdownOpen)]="isOpen2"
      [enableMouseLeave]="false"
      (close)="onClose2()"
      [customStyles]="popupStyles"
    >
      <button class="demo-trigger" dropdown-trigger>Toggle pop-up</button>

      <div dropdown-content>
        <p class="demo-popup-text">Closes with a click outside.</p>
      </div>
    </verben-pop-Up>

    <div class="demo-row">
      <span class="demo-muted">With a close button</span>
      <verben-pop-Up
        [(dropdownOpen)]="isOpen"
        [enableMouseLeave]="false"
        (close)="onClose()"
        [customStyles]="popupStyles"
      >
        <button class="demo-trigger" dropdown-trigger>Toggle pop-up</button>

        <div dropdown-content>
          <div class="demo-popup">
            <p class="demo-popup-text">Content can close it too.</p>
            <button class="demo-trigger" (click)="onClose()">Close</button>
          </div>
        </div>
      </verben-pop-Up>
    </div>

    <p class="demo-muted">The box is larger than the screen on purpose: scroll it.</p>
  </div>
</section>
