<p class="demo-intro">
  <code>verben-mail-template</code> is a ready-made email form: subject, To / CC
  / BCC as chips, an attachment and the message (plain text, or your own rich
  text editor through <code>rich-text</code>). Send emits the payload through
  <code>(mailPayload)</code>.
</p>
<verben-mail-template (mailPayload)="onSubmitMail($event)"></verben-mail-template>
