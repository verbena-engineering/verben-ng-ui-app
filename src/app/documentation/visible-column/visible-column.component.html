<p class="demo-intro">
  <code>verben-visible-column</code> lets users show, hide and (with drag and
  drop) reorder a table's columns. Save emits the new list through
  <code>(columnsUpdated)</code>. The style inputs (bgColor, border,
  primaryColor…) still override the default look.
</p>
<verben-visible-column
  width="400px"
  [columns]="columns"
  [displayedColumns]="5"
  (columnsUpdated)="onColumnsUpdated($event)"
></verben-visible-column>
