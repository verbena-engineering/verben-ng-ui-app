<p class="demo-intro">
  <code>verben-table-filter</code> builds filters from a field, a condition and
  a value; the value input follows the field's type (text, number, decimal,
  date). Saved filters can be ticked, edited or deleted, and Confirm applies
  the ticked ones. The style inputs still override the default look.
</p>
<verben-table-filter width="420px" [filterOptions]="filterArray" [maxFilterLength]="3"></verben-table-filter>
